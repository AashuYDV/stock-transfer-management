services:
  - type: web
    name: stock-transfer-management
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: stms-db
          property: connectionString

databases:
  - name: stms-db
    plan: free
